version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node's types must match the Node major the server and CI run (22), not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (our lint) supports TypeScript <6.1; lift this when it supports newer majors.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for all minor and patch updates, so lockfile changes don't conflict with each other.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
