[package]
name = "ekido_pii"
version = "0.1.0"
edition = "2021"
description = "Finds and removes personal details (phone, email, Aadhaar, PAN, GSTIN, UPI ID, address, name) in a customer's rows. Runs in the browser as WebAssembly, so the raw file never leaves it."
license = "LicenseRef-Ekido"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "score"
path = "src/bin/score.rs"

[dependencies]
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
